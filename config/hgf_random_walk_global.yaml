# Global-like two-stream Gaussian random-walk environment.
#
# Both streams share the same volatility regime:
#
#   S1: both stable
#   V1: both volatile
#   S2: both stable
#   V2: both volatile
#   S3: both stable
#
# The streams have independent Gaussian innovations.
# What is shared is their process-variance schedule, not their direction of movement.

simulation:
  name: "two_stream_hgf_random_walk_global"
  random_seed: 123
  n_trials: 1000

blocks:

  - name: "S1"
    start_index: 0
    stop_index: 200
    stream_a_regime: "stable"
    stream_b_regime: "stable"

  - name: "V1"
    start_index: 200
    stop_index: 400
    stream_a_regime: "volatile"
    stream_b_regime: "volatile"

  - name: "S2"
    start_index: 400
    stop_index: 600
    stream_a_regime: "stable"
    stream_b_regime: "stable"

  - name: "V2"
    start_index: 600
    stop_index: 800
    stream_a_regime: "volatile"
    stream_b_regime: "volatile"

  - name: "S3"
    start_index: 800
    stop_index: 1000
    stream_a_regime: "stable"
    stream_b_regime: "stable"

environment:

  latent_dynamics:

    # Pure Gaussian random walk: no mean reversion.
    lambda_x: 1.0

    # No constant drift.
    rho_x: 0.0

    # Stable process variance.
    # Innovation SD = sqrt(0.0004) = 0.02.
    q_low: 0.0004

    # Volatile process variance.
    # Innovation SD = sqrt(0.01) = 0.10.
    q_high: 0.01

    # Fixed observation noise.
    observation_noise_sd: 0.10

  stream_a:
    initial_mean: 0.0

  stream_b:
    initial_mean: 0.0

output:
  save_environment_csv: true
  save_metadata_json: true